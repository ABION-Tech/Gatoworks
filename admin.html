<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | Gatoworks</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" rel="stylesheet"><link rel="stylesheet" href="modern.css"></head>
<body class="admin" style="padding-top:0;background:var(--mist)">
<div id="gate" class="container py-5" style="max-width:420px"><h1 class="h3">Gatoworks admin</h1><form id="gf"><input id="em" type="email" class="form-control mb-2" placeholder="Email" autocomplete="username" required><input id="pw" type="password" class="form-control mb-2" placeholder="Password" autocomplete="current-password" required><button class="btn btn-primary w-100">Sign in</button><div id="ge" class="text-danger small mt-2"></div></form></div>
<main id="app" class="container py-4" hidden>
<div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3"><h1 class="h3 m-0">Manage images</h1><button id="out" class="btn btn-outline-secondary btn-sm">Sign out</button></div>
<div class="alert alert-info small">Choose a photo for any slot, or paste an image URL. Changes go live for all visitors immediately. Photos are resized to fit.</div>
<div class="row g-3" id="slots"></div></main>
<div id="toast" class="position-fixed bottom-0 start-50 translate-middle-x mb-3 px-3 py-2 rounded bg-dark text-white small" style="display:none;z-index:3000"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const SLOTS=["Images/1.jpeg", "Images/10.jpeg", "Images/11.jpeg", "Images/2.jpeg", "Images/21.jpeg", "Images/22.jpeg", "Images/23.jpeg", "Images/25.jpeg", "Images/26.jpeg", "Images/28.jpeg", "Images/3.jpeg", "Images/32.jpeg", "Images/33.jpeg", "Images/34.jpeg", "Images/35.jpeg", "Images/36.jpeg", "Images/38.jpeg", "Images/39.jpeg", "Images/4.jpeg", "Images/40.jpeg", "Images/44.jpeg", "Images/45.jpeg", "Images/46.jpeg", "Images/48.jpeg", "Images/5.jpeg", "Images/56.jpeg", "Images/7.jpeg", "Images/8.jpeg", "Images/gw/art-abstract-corner.jpg", "Images/gw/art-abstract-detail.jpg", "Images/gw/art-abstract-wall.jpg", "Images/gw/art-floral.jpg", "Images/gw/art-laughing-portrait.jpg", "Images/gw/art-yoruba-figures.jpg", "Images/gw/dome-above.jpg", "Images/gw/dome-columns.jpg", "Images/gw/event-booth.jpg", "Images/gw/event-inside-stand.jpg", "Images/gw/event-visit.jpg", "Images/gw/fashion-flyer.jpg", "Images/gw/hallway-portrait.jpg", "Images/gw/logo.jpg", "Images/gw/mural-arch.jpg", "Images/gw/mural-geometric.jpg", "Images/gw/studio-visit.jpg", "Images/gw/tiedye-portrait.jpg", "Images/svc/bedroom.jpg", "Images/svc/c41.jpg", "Images/svc/c42.jpg", "Images/svc/c43.jpg", "Images/svc/c49.jpg", "Images/svc/c50.jpg", "Images/svc/c51.jpg", "Images/svc/c52.jpg", "Images/svc/c53.jpg", "Images/svc/c54.jpg", "Images/svc/cap.jpg", "Images/svc/ink.jpg", "Images/svc/living.jpg", "Images/svc/pouch.jpg", "Images/svc/press.jpg", "Images/svc/screen.jpg", "Images/svc/shelf.jpg", "Images/svc/sticker.jpg", "Images/svc/tote.jpg", "Images/svc/tshirt.jpg", "Images/svc/tube.jpg"];const $=s=>document.querySelector(s),G=window.GW||{};
if(!G.url||!G.key){document.body.innerHTML='<div class="container py-5"><h1 class="h4">Not set up yet</h1><p>Add your Supabase URL and anon key to <code>config.js</code>. Then reload this page.</p></div>';throw 0}
const sb=supabase.createClient(G.url,G.key);let M={};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)};
function show(on){$('#gate').hidden=on;$('#app').hidden=!on;if(on)load()}
sb.auth.getSession().then(({data})=>show(!!data.session));
$('#gf').onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});if(error)$('#ge').textContent='Sign in failed: '+error.message;else show(true)};
$('#out').onclick=async()=>{await sb.auth.signOut();show(false)};
async function load(){const{data}=await sb.from('site_images').select('key,url');M=Object.fromEntries((data||[]).map(r=>[r.key,r.url]));draw()}
const shrink=f=>new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.85)};i.src=URL.createObjectURL(f)});
async function setUrl(k,url){const{error}=await sb.from('site_images').upsert({key:k,url,updated_at:new Date().toISOString()});toast(error?error.message:'Saved. Live now.');load()}
async function upload(k,file){toast('Uploading...');const blob=await shrink(file),p=k.replace(/[^\w.-]+/g,'_')+'-'+Date.now()+'.jpg',{error}=await sb.storage.from('site-images').upload(p,blob,{contentType:'image/jpeg',cacheControl:'31536000'});if(error)return toast(error.message);setUrl(k,sb.storage.from('site-images').getPublicUrl(p).data.publicUrl)}
function draw(){$('#slots').innerHTML=SLOTS.map((k,n)=>`<div class="col-6 col-md-4 col-lg-3"><div class="card slot h-100 p-2"><img src="${M[k]||k}" alt=""><div class="small text-break my-2">${k}${M[k]?' <span class="badge bg-success">changed</span>':''}</div><input type="file" accept="image/*" class="form-control form-control-sm mb-1" data-f="${n}"><input type="text" class="form-control form-control-sm mb-1" placeholder="or paste image URL" data-u="${n}"><button class="btn btn-sm btn-outline-secondary" data-r="${n}">Reset</button></div></div>`).join('')}
$('#slots').onchange=e=>{const t=e.target;if(t.dataset.f!==undefined&&t.files[0])upload(SLOTS[t.dataset.f],t.files[0]);else if(t.dataset.u!==undefined&&t.value.trim())setUrl(SLOTS[t.dataset.u],t.value.trim())};
$('#slots').onclick=async e=>{const r=e.target.dataset.r;if(r!==undefined){await sb.from('site_images').delete().eq('key',SLOTS[r]);toast('Reset to original.');load()}};
</script></body></html>
