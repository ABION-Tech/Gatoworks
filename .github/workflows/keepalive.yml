# Free keep-alive: pings Supabase twice a week so the free project never pauses from inactivity.
name: keep-supabase-awake
on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "https://pfxlsgmohiziohfpmxhb.supabase.co/rest/v1/site_images?select=key&limit=1" \
            -H "apikey: sb_publishable_KNSa7tC2O7FrDlX560_6TQ_5-IblBMo"
